name: Update Festival Data

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Collect from APIs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run data:collect

      - name: Build comprehensive data
        run: npm run data:build

      - name: Validate data
        run: npm run data:validate

      - name: Build coverage report
        run: npm run data:coverage

      - name: Refresh data
        run: npm run data:update

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/monthly-data-refresh
          commit-message: "chore: monthly archive data refresh"
          title: "chore: monthly archive data refresh"
          body: |
            Automated monthly update of normalized festival and awards datasets.
            - Sorted and refreshed nominations
            - Ready for curator review
          labels: data-update
