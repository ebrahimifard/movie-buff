name: Data correction
description: Propose a correction to a film's data in the archive.
title: "[Data correction] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the archive's accuracy.

        **Fill in only the field(s) you're correcting** — leave the rest blank. Submissions
        touching only the fields below (IMDb ID, poster URL, runtime, genres, synopsis, release
        year, country codes, languages, director) are checked automatically. If validation
        passes, a pull request is opened and merged automatically once it passes the site's
        tests and data-quality checks. If validation fails, you'll get a comment explaining
        what to fix — just edit this issue and it will be re-checked. Anything under "Other"
        (award category, a duplicate record, a brand-new record, etc.) is reviewed and applied
        by hand by a maintainer instead. See `CONTRIBUTING.md` for the full process either way.
        **A source is always required** so the change can be verified, automatically or by a
        human.

  - type: input
    id: film_title
    attributes:
      label: Film title
      placeholder: "e.g. Parasite"
    validations:
      required: true

  - type: input
    id: internal_id
    attributes:
      label: Internal identifier
      description: >-
        The film's IMDb ID (e.g. tt6751668) or internal archive ID, shown in the page URL this
        was linked from. Pre-filled automatically when reached via a "Suggest a Change" link —
        please don't remove it, it's how the record is found.
    validations:
      required: true

  - type: dropdown
    id: festival
    attributes:
      label: Festival
      options:
        - Academy Awards
        - Cannes Film Festival
        - Venice Film Festival
        - Berlin International Film Festival
        - Locarno Film Festival
        - Sundance Film Festival
        - Toronto International Film Festival
        - BAFTA Awards
        - Golden Globes
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "e.g. 2019"
    validations:
      required: true

  - type: input
    id: page_url
    attributes:
      label: Page URL
      description: The archive page you found this on.
      placeholder: "https://..."
    validations:
      required: true

  - type: input
    id: imdb_id
    attributes:
      label: IMDb ID
      description: Leave blank unless this is wrong.
      placeholder: "e.g. tt6751668"
    validations:
      required: false

  - type: input
    id: poster_url
    attributes:
      label: Poster URL
      description: Leave blank unless this is wrong. A direct link to a poster image.
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: runtime_minutes
    attributes:
      label: Runtime (minutes)
      description: Leave blank unless this is wrong.
      placeholder: "e.g. 132"
    validations:
      required: false

  - type: input
    id: genres
    attributes:
      label: Genres
      description: "Leave blank unless this is wrong. Separate multiple values with commas."
      placeholder: "e.g. Drama, War"
    validations:
      required: false

  - type: textarea
    id: synopsis
    attributes:
      label: Synopsis
      description: Leave blank unless this is wrong.
    validations:
      required: false

  - type: input
    id: release_year
    attributes:
      label: Release year
      description: Leave blank unless this is wrong.
      placeholder: "e.g. 2019"
    validations:
      required: false

  - type: input
    id: country_codes
    attributes:
      label: Country codes
      description: >-
        Leave blank unless this is wrong. Two-letter codes, separated by commas if more than
        one.
      placeholder: "e.g. US, FR"
    validations:
      required: false

  - type: input
    id: languages
    attributes:
      label: Languages
      description: "Leave blank unless this is wrong. Separate multiple values with commas."
      placeholder: "e.g. Korean, English"
    validations:
      required: false

  - type: input
    id: director
    attributes:
      label: Director(s)
      description: >-
        Leave blank unless this is wrong. Separate multiple co-directors with commas.
      placeholder: "e.g. Bong Joon Ho"
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Other
      description: >-
        Anything not covered above — award category, cast, a duplicate record, a brand-new
        record, etc. Describe it here; a maintainer will review and apply it by hand. Filling
        this in routes the whole submission to manual review, even if you also filled in fields
        above.
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        A link or citation used to verify this correction. Acceptable sources: IMDb, the
        official festival website, Wikipedia (with its own citation), or another
        primary/reputable source. Submissions without a checkable source will fail validation
        (or, for manual submissions, are unlikely to be reviewed) — this is what keeps the
        archive from filling up with unverifiable guesses.
      placeholder: "https://www.imdb.com/title/... or https://www.festival-site.org/..."
    validations:
      required: true
