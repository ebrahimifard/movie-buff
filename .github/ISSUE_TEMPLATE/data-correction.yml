name: Data correction
description: Propose a correction to a film's data in the archive.
title: "[Data correction] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the archive's accuracy.

        **How this is reviewed**: submissions for the fields listed below (IMDb ID, poster URL,
        runtime, genres, synopsis, release year, country codes, languages) are checked
        automatically. If validation passes, a pull request is opened and merged automatically
        once it passes the site's tests and data-quality checks. If validation fails, you'll get
        a comment explaining what to fix — just edit this issue and it will be re-checked.
        Everything else ("Something else") is reviewed and applied by hand by a maintainer. See
        `CONTRIBUTING.md` for the full process either way. **A source is always required** so the
        change can be verified, automatically or by a human.

  - type: input
    id: film_title
    attributes:
      label: Film title
      placeholder: "e.g. Parasite"
    validations:
      required: true

  - type: input
    id: internal_id
    attributes:
      label: Internal identifier
      description: >-
        The film's IMDb ID (e.g. tt6751668) or internal archive ID, shown in the page URL this
        was linked from. Pre-filled automatically when reached via a "Suggest a Change" link —
        please don't remove it, it's how the record is found.
    validations:
      required: true

  - type: dropdown
    id: festival
    attributes:
      label: Festival
      options:
        - Academy Awards
        - Cannes Film Festival
        - Venice Film Festival
        - Berlin International Film Festival
        - Locarno Film Festival
        - Sundance Film Festival
        - Toronto International Film Festival
        - BAFTA Awards
        - Golden Globes
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "e.g. 2019"
    validations:
      required: true

  - type: input
    id: page_url
    attributes:
      label: Page URL
      description: The archive page you found this on.
      placeholder: "https://..."
    validations:
      required: true

  - type: dropdown
    id: field
    attributes:
      label: What field is wrong?
      description: >-
        Only these fields can be corrected automatically. For anything else (director, cast,
        award category, release year of an entirely new record, duplicates, etc.), pick
        "Something else" — a maintainer will review it by hand.
      options:
        - IMDb ID
        - Poster URL
        - Runtime (minutes)
        - Genres
        - Synopsis
        - Release year
        - Country codes
        - Languages
        - Something else (manual review required)
    validations:
      required: true

  - type: input
    id: new_value
    attributes:
      label: Proposed new value
      description: >-
        The correct value for the field selected above. For Genres, Country codes, or Languages,
        separate multiple values with commas (e.g. "Drama, War" or "US, FR"). If you picked
        "Something else", briefly describe the change here instead — a maintainer will read it.
      placeholder: "e.g. 132"
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: >-
        A link or citation used to verify this correction. Acceptable sources: IMDb, the
        official festival website, Wikipedia (with its own citation), or another
        primary/reputable source. Submissions without a checkable source will fail validation
        (or, for manual submissions, are unlikely to be reviewed) — this is what keeps the
        archive from filling up with unverifiable guesses.
      placeholder: "https://www.imdb.com/title/... or https://www.festival-site.org/..."
    validations:
      required: true
